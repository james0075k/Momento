packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Downloads a mongod binary; not needed until Phase 2 tests (it fetches lazily on first run).
  mongodb-memory-server: false
  # argon2 ships prebuilt binaries; no install script needed.
  argon2: false
  # Uploads source maps to Sentry during the web build (only runs when SENTRY_AUTH_TOKEN is set).
  "@sentry/cli": true
overrides:
  postcss: ">=8.5.18"
  esbuild: ">=0.28.1"
